<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joyce's Closet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Work+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the persisted theme before first paint so the chosen palette never flashes.
      // An unknown/corrupt value matches no CSS block (harmless default look) and is
      // corrected by useThemeStore on startup — no theme-id list is duplicated here.
      try {
        var storedTheme = localStorage.getItem("joyces-closet:theme:v1");
        if (storedTheme)
          document.documentElement.setAttribute("data-theme", storedTheme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
